name: Next build

# Builds the source-next app. Pushes to perf/** branches produce an APK artifact;
# pushing a next-v* tag also publishes a GitHub release with the signed APK.
on:
  push:
    branches:
      - 'perf/**'
    tags:
      - 'next-v*'
  workflow_dispatch:

concurrency:
  group: next-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    defaults:
      run:
        working-directory: source-next
    env:
      # Phones with root are almost all ARM; skipping x86 halves the Rust/C build time.
      ABIS: arm64-v8a,armeabi-v7a
      NDK_VERSION: 30.0.16248370
      CMAKE_VERSION: 3.22.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch native submodules
        working-directory: .
        run: |
          git submodule update --init --depth 1 --jobs 4 -- \
            source-next/native/src/main/jni/external/rustic/rustic_core \
            source-next/native/src/main/jni/external/tar/tar \
            source-next/native/src/main/jni/external/termux-packages/termux-packages \
            source-next/native/src/main/jni/external/xdl/xdl \
            source-next/native/src/main/jni/external/zstd/zstd-jni

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-37" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" > /dev/null

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: source-next/native/src/main/jni/rustic -> target
          cache-targets: false

      - name: Test Rustic bridge
        run: cargo test --locked --manifest-path native/src/main/jni/rustic/Cargo.toml

      - name: Decode signing key
        env:
          STORE_BASE64: ${{ secrets.NEXT_STORE_BASE64 }}
        run: |
          if [ -n "$STORE_BASE64" ]; then
            echo "$STORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::NEXT_STORE_BASE64 is not set; the release APK will be unsigned."
          fi

      - name: Set version suffix
        run: |
          if [[ "$GITHUB_REF" == refs/tags/next-v* ]]; then
            # next-v3.0.0-perf.1 with versionName 3.0.0 becomes 3.0.0-perf.1.
            BASE_VERSION=$(sed -n 's/^versionName = "\(.*\)"/\1/p' gradle/libs.versions.toml)
            TAG_VERSION="${GITHUB_REF_NAME#next-v}"
            SUFFIX="${TAG_VERSION#"$BASE_VERSION"}"
            if [ "$SUFFIX" = "$TAG_VERSION" ]; then
              SUFFIX="-$TAG_VERSION"
            fi
            echo "VERSION_NAME_SUFFIX=$SUFFIX" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME_SUFFIX=-dev.${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          STORE_PASSWORD: ${{ secrets.NEXT_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEXT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEXT_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -Pdatabackup.abis="$ABIS" -Dorg.gradle.jvmargs="-Xmx6g -Dfile.encoding=UTF-8" --stacktrace

      - name: Collect APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          test -n "$APK"
          if [[ "$GITHUB_REF" == refs/tags/next-v* ]]; then
            NAME="DataBackup-${GITHUB_REF_NAME#next-v}.apk"
          else
            NAME="DataBackup-next-dev.${GITHUB_SHA::7}.apk"
          fi
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner
          "$APKSIGNER" verify --print-certs "$APK" || echo "::warning::APK is not signed"
          mkdir -p "$RUNNER_TEMP/out"
          cp "$APK" "$RUNNER_TEMP/out/$NAME"
          echo "path=$RUNNER_TEMP/out/$NAME" >> "$GITHUB_OUTPUT"
          sha256sum "$RUNNER_TEMP/out/$NAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DataBackup-next-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Upload lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: source-next/**/build/reports/lint-results-*.html
          if-no-files-found: ignore

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/next-v')
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.path }}" --title "$GITHUB_REF_NAME" --notes-file "$NOTES" --prerelease
          else
            gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.path }}" --title "$GITHUB_REF_NAME" --generate-notes --prerelease
          fi
